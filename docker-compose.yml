# One shared, prebuilt image; one stable service/workspace/password per student.
# See docker/README.md. No build or image pull occurs through this configuration.
name: afec-bayes-2026

x-student: &student
  image: "${AFEC_IMAGE:-afec-bayes:2026-r4.6.1}"
  platform: linux/amd64
  pull_policy: never
  restart: unless-stopped
  cpus: "${AFEC_CPUS:-1.0}"
  mem_limit: "${AFEC_MEMORY_LIMIT:-3g}"
  memswap_limit: "${AFEC_MEMORY_LIMIT:-3g}"
  pids_limit: 256
  stop_grace_period: 60s
  environment:
    ROOT: "FALSE"
    DISABLE_AUTH: "FALSE"
    DEFAULT_USER: rstudio
    AFEC_CLASSROOM: "TRUE"
    AFEC_USE_PRECOMPUTED: "TRUE"
    OMP_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    BLIS_NUM_THREADS: "1"
    VECLIB_MAXIMUM_THREADS: "1"
    NUMEXPR_NUM_THREADS: "1"
    RCPP_PARALLEL_NUM_THREADS: "1"
    MAKEFLAGS: "-j1"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "--output", "/dev/null", "http://127.0.0.1:8787/"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  # Inherit root startup and /init. Do not set user, command or entrypoint.

services:
  student01:
    <<: *student
    env_file:
      - "${AFEC_CREDENTIALS_DIR:-./.afec-credentials}/student01.env"
    ports:
      - "${AFEC_BIND_IP:-127.0.0.1}:8801:8787"
    volumes:
      - student01-workspace:/home/rstudio/workspace
    networks:
      - classroom

